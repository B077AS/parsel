name: Build release files

# Runs when you publish a release on GitHub (Releases > Draft a new release > choose a tag such as v0.1.0 > Publish release).
# It builds the Windows installer (a branded wizard) and portable zip, the Linux .deb and .tar.gz, and a zip of the jars, then attaches them to that
# release. The tag decides the version, so tag it v0.1.0 for 0.1.0.
#
# "Run workflow" on the Actions tab does the same build without a release: the files only appear as downloads of that run, which
# is the way to try this workflow out before the first real release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to put on the files (for example 0.1.0)
        required: true
        default: 0.0.0-test

permissions:
  contents: write # attach files to the release

env:
  VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}

jobs:
  windows:
    name: Windows (installer and portable zip)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The installer is an Inno Setup wizard around the app folder jpackage builds (packaging/windows/parsel.iss).
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --no-progress -y
          }

      - name: Build the page
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build the jars
        run: |
          mvn -B versions:set -DnewVersion="${VERSION#v}" -DgenerateBackupPoms=false
          mvn -B clean package -DskipTests

      - name: Package for Windows
        run: |
          node packaging/package.mjs windows-installer --version "$VERSION"
          node packaging/package.mjs windows-portable --version "$VERSION"

      - name: Checksums
        working-directory: target/dist
        run: sha256sum * > SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/*

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" target/dist/* --clobber

  linux:
    name: Linux (.deb, .tar.gz and jars)
    # The oldest Ubuntu GitHub still offers: a .deb names its dependencies as the building system calls them (Ubuntu 24.04 says
    # libasound2t64, which older systems do not have), and the bundled runtime needs a glibc no newer than the users'.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Tools for building a .deb
        run: sudo apt-get update && sudo apt-get install -y fakeroot zip

      - name: Build the page
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build the jars
        run: |
          mvn -B versions:set -DnewVersion="${VERSION#v}" -DgenerateBackupPoms=false
          mvn -B clean package -DskipTests

      - name: Package for Linux
        env:
          # Shown as the maintainer of the .deb: the person who published the release, by their GitHub no-reply address.
          PARSEL_DEB_MAINTAINER: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>
        run: |
          node packaging/package.mjs linux-deb --version "$VERSION"
          node packaging/package.mjs linux-tarball --version "$VERSION"
          node packaging/package.mjs jars --version "$VERSION"

      - name: Checksums
        working-directory: target/dist
        run: sha256sum * > SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/dist/*

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" target/dist/* --clobber
